<title>عقارات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Concept: a site walk-through. Dark viewport, quiet instrument-panel HUD, one teal accent, amber for measurements. */
:root{--bg:#0d1117;--panel:rgba(18,24,33,.88);--panel-solid:#161d29;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3547;--accent:#2dd4bf;--accent-ink:#052e2a;--amber:#fbbf24;--bad:#f87171;color-scheme:dark;
 --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.top{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;overflow-x:auto;direction:rtl;padding-bottom:4px}
.top button,.dock button,.tabs button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)}
.top button{flex:none;font-size:14px}
.top button.on,.dock button.on,.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;direction:rtl;z-index:30}
.dock button{font-size:15px;padding:10px 14px}
.stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:132px;height:132px;border-radius:50%;background:rgba(18,24,33,.45);border:2px solid rgba(255,255,255,.22);touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.5)}
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 56px);font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;direction:rtl;pointer-events:none;font-variant-numeric:tabular-nums}
.sheet{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 54px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(440px,calc(100% - 20px));z-index:20;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;display:none;flex-direction:column;direction:rtl;touch-action:pan-y;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.sheet.open{display:flex}
.sheet.left{right:auto;left:max(10px,env(safe-area-inset-left,0px))}
.sheet.min{bottom:auto!important;height:auto!important}.sheet.min .tabs,.sheet.min .body,.sheet.min .rsz{display:none}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;font-weight:600}
.sbtns{display:flex;gap:6px}.sbtns button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-width:40px;height:36px;font-size:16px;cursor:pointer}
.rsz{position:absolute;left:0;bottom:0;width:30px;height:30px;cursor:nesw-resize;touch-action:none;background:linear-gradient(45deg,transparent 50%,var(--muted) 50%,var(--muted) 56%,transparent 56%,transparent 70%,var(--muted) 70%,var(--muted) 76%,transparent 76%);border-bottom-left-radius:14px;opacity:.7}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{flex:none;font-size:14px;padding:6px 12px}
.body{padding:12px 14px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.body h4{margin:16px 0 6px;font-size:14px;color:var(--amber);font-weight:600}
.body h4:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.row label{flex:1 1 130px;color:var(--ink)}
.row input[type=range]{flex:2 1 150px;accent-color:var(--accent)}
.row select,.row input[type=number]{flex:1 1 130px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-start:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.3)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.tg input{width:22px;height:22px;accent-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:6px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
td input{width:90px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.note{font-size:13.5px;color:var(--muted);line-height:1.7}
.need li{margin:4px 0}
.tot{font-size:17px;font-weight:700;color:var(--accent)}
.shot{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;direction:rtl}
.shot.open{display:flex}
.shot img{max-width:100%;max-height:78%;border-radius:8px}
.shot button{font:inherit;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel-solid);color:var(--ink)}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;direction:rtl;line-height:1.8}
.stick{width:156px!important;height:156px!important}.stick i{width:64px!important;height:64px!important;margin:-32px!important}
.mini{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 190px);width:240px;height:100px;background:rgba(18,24,33,.74);border:1px solid var(--line);border-radius:10px;touch-action:none;z-index:15}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);max-width:min(92%,560px);background:var(--amber);color:#1a1200;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;line-height:1.6;z-index:40;display:none;direction:rtl;text-align:center}
#toast.on{display:block}
.zoombar{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 100px);display:flex;flex-direction:column;gap:8px;z-index:25;direction:rtl}
.zoombar button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:52px;height:48px;font-size:20px;cursor:pointer;padding:0 10px;backdrop-filter:blur(6px)}
.lbl.room{pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.62);font-weight:600}
.lbl.f{font-size:12px;background:rgba(15,118,110,.85);pointer-events:auto;cursor:pointer;padding:0 6px}
.lbl.wn{background:var(--amber);color:#1a1200;font-weight:800;font-size:17px;width:30px;height:30px;border-radius:50%;padding:0;text-align:center;line-height:30px;pointer-events:auto;cursor:pointer;border:2px solid #fff}
.lbl.sel{background:var(--amber);color:#1a1200}
.dpad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:8px 0}
.dpad button{height:48px;font-size:20px}
.dpad .sp{visibility:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:13px;background:rgba(0,0,0,.55);color:#fff;padding:1px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
</style>

<div id="app">
  <canvas id="c" tabindex="0"></canvas>
  <div id="labels"></div>
  <div class="top" id="presets"></div>
  <div class="zoombar" id="zoombar"><button id="oIn" aria-label="تكبير">➕</button><button id="oOut" aria-label="تصغير">➖</button><button id="oFit" aria-label="الشقة كلها">⤢</button><button id="oTop" aria-label="من فوق" class="orbonly">⬇</button><button id="oHere" aria-label="ادخل هنا" class="orbonly">🚶</button><button id="oL90" class="walkonly" aria-label="لفّ شمال 90 درجة">⟲ 90°</button><button id="oR90" class="walkonly" aria-label="لفّ يمين 90 درجة">⟳ 90°</button><button id="oSpinL" class="walkonly" aria-label="لفّ شمال 360 درجة">🔄 شمال</button><button id="oSpinR" class="walkonly" aria-label="لفّ يمين 360 درجة">🔄 يمين</button></div>
  <div class="hud" id="hud"></div>

  <div class="dock">

    <div class="shead" id="shead"><span>الخيارات</span><span class="sbtns"><button id="sSide" aria-label="انقل اللوحة لجهة تانية">⇄</button><button id="sSize" aria-label="غيّر حجم اللوحة">⤢</button><button id="sMin" aria-label="صغّر اللوحة">—</button><button id="sClose" aria-label="اقفل اللوحة">✕</button></span></div>
    <div class="tabs" id="tabs"></div>

  </div>

  <div id="err"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const T=window.THREE, $=id=>document.getElementById(id);
if(!T){const e=$('err');e.style.display='flex';e.textContent='ما قدرتش أحمّل مكتبة الـ 3D. تأكد من النت وحدّث الصفحة.';throw new Error('no three')}

/* ================= parameters & state ================= */
const APT=new URLSearchParams(location.search).get('apt')||'apt1';
const P={ceil:2.7,doorH:2.3,doorW:1.0,balc:1.5,sill:.9,eye:1.6,fov:72};
const ST={pal:1,main:'porcelain',bed:'wood',cove:true,spots:true,accent:true,curtains:true,kitOpen:false,doorsOpen:true,hour:16,north:270,light:'studio',tile:.6,cor:'wood',door:'brown',lamps:false,labels:true,q:(/iPad|iPhone|Android|Mobile/i.test(navigator.userAgent)||navigator.maxTouchPoints>1)?'mid':'high',speed:1.6,sens:1,inv:false,autoLevel:true,spin:0,spinSpeed:.45,stickMode:'turn',turn:1.6,cut:false,furn:true,plants:true,fdir:false,flab:false,wnum:false,
  lay:{liv:0,din:0,kit:0,b1:0,b2:0}};
const PALS=[
 {n:'ساحل إسكندرية',w:'#eef1f0',a:'#7fa6b5',f:'#d8d2c6',wd:'#c9a77c',m:'#bfc5c8'},
 {n:'Greige دافئ',w:'#ddd6cb',a:'#a89f91',f:'#bdb3a3',wd:'#7a5c45',m:'#b08d57'},
 {n:'زيتوني وبيج',w:'#e7e2d5',a:'#6b7b5a',f:'#c8a982',wd:'#3e4a3a',m:'#b08d57'},
 {n:'نيوكلاسيك أبيض وذهبي',w:'#f6f4ef',a:'#c8a24a',f:'#e9e6df',wd:'#2b2b2b',m:'#c8a24a'},
 {n:'فحمي وجوز',w:'#4a4e52',a:'#b89b72',f:'#8b6b4f',wd:'#5b4331',m:'#1c1c1c'},
 {n:'سكندنافي فاتح',w:'#f4f3f0',a:'#d9b99b',f:'#e3d3bc',wd:'#c9a77c',m:'#4a4f55'},
 {n:'طيني دافئ',w:'#e8d8c8',a:'#b5654a',f:'#c9b79c',wd:'#5c3d2e',m:'#7a5c45'},
];
try{const s=JSON.parse(localStorage.getItem('prop:'+APT+':st')||'null');if(s){Object.assign(ST,s,{lay:Object.assign(ST.lay,s.lay||{})});if(s.P)Object.assign(P,s.P)}}catch(e){}
const save=()=>{try{localStorage.setItem('prop:'+APT+':st',JSON.stringify(Object.assign({},ST,{P})))}catch(e){}};

/* ================= model: loaded from apartments/<id>/model.json ================= */
let MODEL=null,ROOMS=[],RM={},WALLS=[],FURN=[];

/* ================= three.js setup ================= */
const canvas=$('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'})}
catch(e){const x=$('err');x.style.display='flex';x.textContent='المتصفح ده مش بيدعم عرض الـ 3D (WebGL).';throw e}
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const cam=new T.PerspectiveCamera(P.fov,1,.05,400);
const world=new T.Group();scene.add(world);
let wallGrp,furnGrp,ceilGrp,lightGrp,extGrp;
const matCache=new Map();
function mat(color,r=.85,m=0,extra){const k=color+'|'+r+'|'+m+(extra?JSON.stringify(extra):'');let x=matCache.get(k);if(!x){x=new T.MeshStandardMaterial(Object.assign({color,roughness:r,metalness:m,envMapIntensity:m>.5?1.0:.14},extra||{}));matCache.set(k,x)}return x}
const mix=(a,b,p)=>{const n=(h,i)=>parseInt(h.slice(i,i+2),16);const c=i=>Math.round(n(a,i)*(1-p)+n(b,i)*p).toString(16).padStart(2,'0');return'#'+c(1)+c(3)+c(5)};
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();

/* ----- procedural textures ----- */
function ctex(draw,size=512){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;t.anisotropy=8;return t}
const texCache=new Map();
function floorTex(kind,base){
  const k=kind+base;if(texCache.has(k))return texCache.get(k);
  const t=ctex((g,s)=>{
    if(kind==='wood'){
      const n=5;for(let i=0;i<n;i++){const y=i*s/n,tone=mix(base,'#000000',.04+rnd()*.16);g.fillStyle=tone;g.fillRect(0,y,s,s/n);
        for(let j=0;j<26;j++){g.strokeStyle='rgba(60,35,15,'+(.04+rnd()*.07)+')';g.lineWidth=1;g.beginPath();const yy=y+rnd()*(s/n);g.moveTo(0,yy);g.bezierCurveTo(s*.3,yy+rnd()*5-2.5,s*.6,yy+rnd()*5-2.5,s,yy);g.stroke()}
        g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,y,s,2);const o=rnd()*s;g.fillRect(o,y,2,s/n)}
    }else if(kind==='marble'){
      g.fillStyle=base;g.fillRect(0,0,s,s);
      for(let i=0;i<14;i++){g.strokeStyle='rgba(110,115,125,'+(.08+rnd()*.18)+')';g.lineWidth=.6+rnd()*2.2;g.beginPath();let x=rnd()*s,y=0;g.moveTo(x,y);for(let k2=0;k2<8;k2++){x+=rnd()*90-45;y+=s/8;g.lineTo(x,y)}g.stroke()}
      g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,0,s,2);g.fillRect(0,0,2,s);
    }else{ // porcelain / dark
      g.fillStyle=base;g.fillRect(0,0,s,s);
      for(let i=0;i<2600;i++){g.fillStyle='rgba('+(rnd()>.5?'255,255,255':'0,0,0')+','+(rnd()*.05)+')';g.fillRect(rnd()*s,rnd()*s,2,2)}
      g.fillStyle='rgba(20,18,14,.55)';g.fillRect(0,0,s,5);g.fillRect(0,0,5,s);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,5,s,2);g.fillRect(5,0,2,s);
    }
  });
  texCache.set(k,t);return t;
}
function floorMat(kind,base,w,d){
  const t=floorTex(kind,base).clone();t.needsUpdate=true;
  const tile=kind==='wood'?1.0:ST.tile;t.repeat.set(w/tile,d/tile);
  return new T.MeshStandardMaterial({map:t,roughness:kind==='marble'?.18:kind==='wood'?.45:.28,metalness:0,envMapIntensity:kind==='wood'?.3:.5});
}

/* ================= helpers ================= */
const box=(w,h,d,x,y,z,m,ry=0,g)=>{const me=new T.Mesh(new T.BoxGeometry(w,h,d),m);me.position.set(x,y+h/2,z);me.rotation.y=ry;me.castShadow=true;me.receiveShadow=true;g.add(me);return me};
const rgeoCache=new Map();
function rgeo(w,h,d,r){const k=[w,h,d,r].map(v=>v.toFixed(3)).join();if(rgeoCache.has(k))return rgeoCache.get(k);
  r=Math.min(r,w/2-.002,h/2-.002,d/2-.002);const sw=w-2*r,sh=h-2*r,s=new T.Shape();s.moveTo(-sw/2,-sh/2);s.lineTo(sw/2,-sh/2);s.lineTo(sw/2,sh/2);s.lineTo(-sw/2,sh/2);s.closePath();
  const g=new T.ExtrudeGeometry(s,{depth:Math.max(.002,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:3,curveSegments:2});g.translate(0,0,-(d-2*r)/2);rgeoCache.set(k,g);return g}
const sbox=(w,h,d,x,y,z,m,ry,g,r=.04)=>{const me=new T.Mesh(rgeo(w,h,d,r),m);me.position.set(x,y+h/2,z);me.rotation.y=ry||0;me.castShadow=true;me.receiveShadow=true;g.add(me);return me};
const cyl=(r,h,x,y,z,m,g,seg=20)=>{const me=new T.Mesh(new T.CylinderGeometry(r,r,h,seg),m);me.position.set(x,y+h/2,z);me.castShadow=true;me.receiveShadow=true;g.add(me);return me};
const sph=(r,x,y,z,m,g)=>{const me=new T.Mesh(new T.SphereGeometry(r,16,12),m);me.position.set(x,y,z);me.castShadow=true;g.add(me);return me};
const roomAt=(x,z)=>{let best=null;for(const r of ROOMS){if(x>=r.x0-.02&&x<=r.x1+.02&&z>=r.z0-.02&&z<=r.z1+.02){if(!best||(r.x1-r.x0)*(r.z1-r.z0)<(best.x1-best.x0)*(best.z1-best.z0))best=r}}return best};
let colliders=[],Q;
const pal=()=>PALS[ST.pal];
function wallColor(room,wid){
  const p=pal();if(!room)return mix(p.w,'#9a9a90',.25);
  if(ST.accent&&((room.id==='liv'&&wid==='H3')||(room.id==='ms'&&wid==='H8')||(room.id==='din'&&wid==='V3')))return p.a;
  switch(room.k){case'wet':return'#e6e9ec';case'ter':case'land':return'#d9d4c8';case'bed':return mix(p.w,p.a,.14);case'kit':return mix(p.w,'#ffffff',.5);default:return p.w}
}

/* ================= building the shell ================= */
function addPiece(w,u0,u1,y0,y1,list){
  const vert=w.ax==='v',len=u1-u0,h=y1-y0;if(len<.005||h<.005)return;
  const uc=(u0+u1)/2,yc=(y0+y1)/2,t=w.t;
  const sx=vert?t:len,sz=vert?len:t;
  const cx=vert?w.p:uc,cz=vert?uc:w.p;
  const off=t/2+.07;
  const sideP=vert?roomAt(cx+off,cz):roomAt(cx,cz+off), sideN=vert?roomAt(cx-off,cz):roomAt(cx,cz-off);
  const mP=mat(wallColor(sideP,w.id),.92,0,{vertexColors:true}),mN=mat(wallColor(sideN,w.id),.92,0,{vertexColors:true}),mT=mat('#f2f0ea',.9,0,{vertexColors:true});
  const mats=vert?[mP,mN,mT,mT,mT,mT]:[mT,mT,mT,mT,mP,mN];
  const bg=new T.BoxGeometry(sx,h,sz);{const pa=bg.attributes.position,col=new Float32Array(pa.count*3);for(let i=0;i<pa.count;i++){const t=(pa.getY(i)+h/2)/h;const sh=y0<.05?(.6+.4*Math.min(1,t*1.8)):1;col[i*3]=col[i*3+1]=col[i*3+2]=y1>=P.ceil-.05?sh*(t>.9?.93:1):sh}bg.setAttribute('color',new T.BufferAttribute(col,3))}
  const me=new T.Mesh(bg,mats);me.userData={wid:w.id};me.position.set(cx,yc,cz);me.castShadow=true;me.receiveShadow=true;wallGrp.add(me);

  const ov=(r,vert,a,b)=>{const lo=vert?r.z0:r.x0,hi=vert?r.z1:r.x1;return Math.min(hi,b)-Math.max(lo,a)>.3};
  for(const op of (edits.w||[])){
    const w=walls.find(x=>x.id===(op.wall||op.id));if(!w)continue;
    if(op.t==='rm')w.removed=true;
    else if(op.t==='rmop')w.op=(w.op||[]).filter(o=>o.id!==op.oid);
    else if(op.t==='addop')w.op=(w.op||[]).concat([Object.assign({},op.op)]);

  if(mode!=='walk')return;const k=pos.x.toFixed(2)+pos.z.toFixed(2)+yaw.toFixed(2)+WALLS.length+(edits.w||[]).length;if(k===mKey)return;mKey=k;
  miniLayout();const c=mctx,W=mini.width,H=mini.height;c.clearRect(0,0,W,H);c.strokeStyle='rgba(255,255,255,.8)';c.lineCap='butt';
  for(const w of WALLS){if(w.removed)continue;c.lineWidth=Math.max(2.5,w.t*mS);c.beginPath();if(w.ax==='v'){c.moveTo(w.p*mS+mX,w.a*mS+mZ);c.lineTo(w.p*mS+mX,w.b*mS+mZ)}else{c.moveTo(w.a*mS+mX,w.p*mS+mZ);c.lineTo(w.b*mS+mX,w.p*mS+mZ)}c.stroke()}
  c.fillStyle='#fbbf24';c.save();c.translate(pos.x*mS+mX,pos.z*mS+mZ);c.rotate(yaw);c.beginPath();c.moveTo(0,-16);c.lineTo(10,10);c.lineTo(-10,10);c.closePath();c.fill();c.restore()}
mini.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();const r=mini.getBoundingClientRect(),x=((e.clientX-r.left)/r.width*mini.width-mX)/mS,z=((e.clientY-r.top)/r.height*mini.height-mZ)/mS;

const PR=(()=>{try{return JSON.parse(localStorage.getItem('prop:'+APT+':pr')||'{}')}catch(e){return{}}})();

  if(b.dataset.mv){nudge(b.dataset.mv);return}
  if(b.dataset.rot){rotItem(+b.dataset.rot);return}
  if(b.dataset.add){addItem(b.dataset.add);renderTabs();return}
  if(b.dataset.act){const a=b.dataset.act;if(a==='centerwall'){moveToRoomWall(0,true);return}
  if(a==='snapwall'){const it=selId&&itemById(selId);const pp=it&&snapItemToWall(it);if(pp){patchItem(selId,pp);refurnish()}else toast('مفيش حيطة قريبة من القطعة دي')}else if(a==='straight'){const it=selId&&itemById(selId);if(it){patchItem(selId,{ry:+(Math.round((it.ry||0)/(Math.PI/2))*Math.PI/2).toFixed(4)});refurnish()}}else if(a==='dup')dupItem();else if(a==='del'){delItem();renderTabs()}else if(a==='reset')resetItem();else if(a==='resetall')resetAll();else if(a==='copyedits')copyText(editsText(),'copyMsg');else if(a==='copylink')copyText(shareLink(),'copyMsg');return}
  if(b.dataset.hr){ST.hour=+b.dataset.hr;setTime();renderTabs();dirty();return}
  const k=b.dataset.k;if(k==null)return;let v=b.dataset.v;
  if(k.startsWith('lay.')){ST.lay[k.slice(4)]=+v;rebuild()}
  else if(k==='pal'){ST.pal=+v;rebuild()}
  else if(k==='q'){ST.q=v;applyQuality();rebuild()}
  else if(k==='stickMode'){ST.stickMode=v}

  else if(k==='light'){ST.light=v;setTime()}

  renderTabs();dirty();
});
$('body').addEventListener('change',e=>{
